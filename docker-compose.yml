services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: doer
      POSTGRES_PASSWORD: doer
      POSTGRES_DB: doer
    ports:
      - "5432:5432"
    volumes:
      - doer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doer -d doer"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://doer:doer@db:5432/doer
    # Migrations run on start so `docker compose up` works from a fresh clone.
    # A deployed environment should run them as a separate step instead, where a
    # failed migration must not take the service down with it.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn doer.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8787:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:23-slim
    working_dir: /web
    command: sh -c "npm install -g pnpm@10.33.2 && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      VITE_API_BASE: http://localhost:8787
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
      - doer-web-modules:/web/node_modules
      # pnpm cannot hardlink from the bind-mounted project root into its home
      # store, so it falls back to <project>/.pnpm-store. Without this volume that
      # path resolves to frontend/.pnpm-store on the host and 122 MB of package
      # store gets committed: see
      # docs/fixes/fix_plan_pnpm-store-committed-to-history.md.
      - doer-web-store:/web/.pnpm-store

  # The suite drops and re-migrates the schema it is pointed at, so it gets its
  # own service rather than borrowing the api container, which carries the
  # production DATABASE_URL. Deliberately no `env_file: .env`: that file names
  # the production database too.
  #   docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment:
      DOER_TEST_DATABASE_URL: postgresql+asyncpg://doer:doer@db:5432/doer_test
    # `python -m` rather than bare `pytest`: the app package is bind-mounted, not
    # installed, so it is importable only when the working directory is on sys.path.
    command: ["python", "-m", "pytest"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # Hourly dumps, 48 retained. Added after a test run against the production
  # database destroyed everything with no way back: see
  # docs/fixes/fix_plan_tests-wipe-production-database.md.
  backup:
    image: postgres:17
    environment:
      PGPASSWORD: doer
    command: ["sh", "-c", "mkdir -p /backups && while true; do pg_dump -h db -U doer -d doer -F c -f /backups/doer-$$(date +%Y%m%d-%H%M%S).dump && ls -1t /backups/*.dump | tail -n +49 | xargs -r rm -f; sleep 3600; done"]
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  doer-pgdata:
  doer-web-modules:
  doer-web-store:
