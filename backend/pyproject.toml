[project]
name = "doer"
version = "0.1.0"
description = "Daily task planner built on the 75% commitment rule"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends() in an argument default is the FastAPI idiom, not a mutable-default bug.
"doer/api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine fixture is session-scoped and holds real connections. Without
# pinning the loop scope to match, each test gets a fresh event loop and those
# connections belong to a dead one.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The live suite calls the real API. Excluded by default so the standard run is
# deterministic, offline, and free; run it with `pytest -m live` to catch prompt
# and API drift.
addopts = "-m 'not live'"
markers = ["live: hits the real Anthropic API; excluded from the default run"]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doer"]
